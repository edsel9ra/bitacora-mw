services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_plain_app
    working_dir: /var/www/html
    mem_limit: 1g
    cpus: 0.5
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-php_app}
      MYSQL_USER: ${MYSQL_USER:-php_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-php_password}
      BITACORA_STORAGE_PATH: /var/www/html/storage/bitacoras_pdf
      APP_ENABLE_LEGACY_BITACORA: ${APP_ENABLE_LEGACY_BITACORA:-false}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-Lax}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-3600}
      SESSION_MAX_LIFETIME_SECONDS: ${SESSION_MAX_LIFETIME_SECONDS:-43200}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: none
      SMTP_AUTH: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: bitacora@localhost.test
      SMTP_VERIFY_TLS: "true"
      SMTP_TIMEOUT_SECONDS: 20
      SMTP_HELO_NAME: ""
      BITACORA_PDF_TTL_DAYS: ${BITACORA_PDF_TTL_DAYS:-90}
      BITACORA_DRAFT_TTL_DAYS: ${BITACORA_DRAFT_TTL_DAYS:-30}
      BITACORA_DRAFT_MAX_BYTES: ${BITACORA_DRAFT_MAX_BYTES:-262144}
      BITACORA_DRAFT_KEY_BASE64: ${BITACORA_DRAFT_KEY_BASE64:-}
      BITACORA_DRAFT_KEYRING_JSON: ${BITACORA_DRAFT_KEYRING_JSON:-}
      BITACORA_DRAFT_ACTIVE_KEY_VERSION: ${BITACORA_DRAFT_ACTIVE_KEY_VERSION:-1}
      BITACORA_MAIL_ASYNC: ${BITACORA_MAIL_ASYNC:-false}
      BITACORA_SUBMISSION_CLAIM_TTL_SECONDS: ${BITACORA_SUBMISSION_CLAIM_TTL_SECONDS:-300}
    command: sh -lc "composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-scripts && php database/migrate.php && php scripts/import_bitacora_recipients.php && mkdir -p public/uploads/preventivos public/uploads/correctivos public/uploads/locativos/preventivos public/uploads/locativos/correctivos storage/bitacoras_pdf storage/logs && chown -R www-data:www-data public/uploads storage && chmod -R ug+rwX public/uploads storage && exec php-fpm"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000,$$errno,$$errstr,2) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - php_plain_net

  nginx:
    image: nginx:1.31-alpine
    container_name: php_plain_nginx
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/php-healthz.php >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - php_plain_net

  db:
    image: mysql:8.4
    container_name: php_plain_db
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-php_app}
      MYSQL_USER: ${MYSQL_USER:-php_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-php_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - php_plain_net

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: php_plain_phpmyadmin
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - db
    networks:
      - php_plain_net

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: php_plain_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    networks:
      - php_plain_net

networks:
  php_plain_net:
    driver: bridge

volumes:
  db_data:
