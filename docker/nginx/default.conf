limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /var/www/html/public;
    index index.php index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 16M;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        rewrite ^ /php-healthz.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* (^|/)(composer\.(json|lock)|\.env|README|config(?:/|$)|phpmailer(?:/|$)|storage(?:/|$)|logs(?:/|$)|vendor(?:/|$)|error_log$|.*\.(?:log|bak|old|map)$|.*Zone\.Identifier$) {
        deny all;
    }

    location ~* ^/(vistas/(mes_group|mes_soluciones_hcqc|les_group|inversiones_valquin|lebor_sas|supervisiones|mes_trilogia|mes_test)\.php|scripts/(send_mesg|send_msg|send_lesg|send_inva|send_lebor|send_sup|send_trilogia|send_test|generar_pdf|pdf_builder)\.php)$ {
        return 410;
    }

    location ~* ^/uploads/.*\.(?:php\d*|phtml|phar|shtml)$ {
        deny all;
    }

    location = /bd/login.php {
        limit_req zone=login_limit burst=20 nodelay;
        try_files $uri =404;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ \.php$ {
        try_files $uri =404;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
    }
}
